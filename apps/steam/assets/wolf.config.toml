[[apps]]
title = "Steam"
icon_png_path = "https://games-on-whales.github.io/wildlife/apps/steam/assets/icon.png"

[apps.runner]
type = "docker"
name = "WolfSteam"
image = "ghcr.io/penturduckenline/gow-app-steam:fedora"
mounts = [
    '/var/run/slim.auth:/tmp/slim.auth:ro',
    '/tmp/.X11-unix:/tmp/.X11-unix:rw'
]
env = [
    "RUN_SWAY=true",
    'GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/kfd/*',
    'RADV_FORCE_VRAM=65536',
    'RADV_FORCE_GTT=65536',
    'XAUTHORITY=/tmp/slim.auth'
]
devices = [
    '/dev/dri:/dev/dri',
    '/dev/kfd:/dev/kfd'
]
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CapAdd": ["SYS_ADMIN", "SYS_NICE", "SYS_PTRACE", "NET_RAW", "MKNOD", "NET_ADMIN"],
    "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
    "Ulimits": [{"Name":"nofile", "Hard":10240, "Soft":10240}],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"],
    "GroupAdd": ["video"]
  }
}
\
"""